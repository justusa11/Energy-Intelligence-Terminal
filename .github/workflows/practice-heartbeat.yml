name: Practice Supabase Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HEARTBEAT_SOURCE: github_actions_practice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Require database secret
        run: test -n "$DATABASE_URL"
      - name: Write practice heartbeat
        run: python pipelines/jobs/write_system_heartbeat.py
