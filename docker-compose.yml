# Local development stack: Postgres + FastAPI backend + Next.js frontend.
# Usage:  docker compose up --build
# The backend waits for Postgres, creates tables on startup, and (first run)
# you can seed sample data with:
#   docker compose exec backend python -m scripts.seed_sample_data --days 14

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: energy_terminal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/energy_terminal
      BACKEND_CORS_ORIGINS: http://localhost:3000
      ENERGI_DATA_SERVICE_BASE_URL: https://api.energidataservice.dk
      OPEN_METEO_BASE_URL: https://api.open-meteo.com
    command: >
      sh -c "python -c 'from app.db.init_db import init_db; init_db()' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    command: sh -c "npm run build && npm run start"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
